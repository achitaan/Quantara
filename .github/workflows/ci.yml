name: Quantara checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          {
            python-version: "3.12",
            cache: pip,
            cache-dependency-path: backend/requirements.txt,
          }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: pip install -r backend/requirements.txt
      - name: Start PostgreSQL with an ephemeral password
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "TEST_POSTGRES_URL=postgresql+psycopg://quantara:$POSTGRES_PASSWORD@localhost:5432/quantara" >> "$GITHUB_ENV"
          docker run -d --name quantara-test-postgres \
            -e POSTGRES_DB=quantara -e POSTGRES_USER=quantara -e POSTGRES_PASSWORD \
            -p 127.0.0.1:5432:5432 postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec quantara-test-postgres pg_isready -h 127.0.0.1 -U quantara; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python -m ruff check backend/quantara backend/tests scripts
      - run: python -m pytest
      - run: python scripts/export_openapi.py
      - run: npm ci && npm run types && npm run typecheck && npm run build
        working-directory: frontend
      - run: git diff --exit-code docs/openapi.json frontend/lib/api-types.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Validate Compose with ephemeral credentials
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 32)
          export TEAM_PASSWORD=$(openssl rand -hex 32)
          docker compose config --quiet
      - name: Stop test PostgreSQL
        if: always()
        run: docker rm -f quantara-test-postgres
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-test-results, path: frontend/test-results }
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend/requirements-models.txt
      - run: python scripts/cache_embedding_model.py
        env:
          HF_HOME: runtime/huggingface
      - run: QUANTARA_MODEL_TESTS=1 python -m pytest backend/tests/test_optional_models.py backend/tests/test_lightweight_models.py backend/tests/test_research_accuracy.py
        env:
          HF_HOME: runtime/huggingface
